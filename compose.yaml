services:
  backend:
    build: ./backend-spring
    volumes:
      - h2-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/contatos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build: .
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/contatos"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  h2-data:
