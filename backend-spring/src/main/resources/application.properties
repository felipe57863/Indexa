# Nome da aplicação
spring.application.name=backend-spring

# Porta utilizada pela API
server.port=3000

# Banco H2 salvo em arquivo
spring.datasource.url=jdbc:h2:file:./contatosdb
spring.datasource.username=sa
spring.datasource.password=

# Cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update