# O DNS do Docker permite reencontrar o backend após recriar seu container.
upstream indexa_backend {
    zone indexa_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:3000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserva uploads de avatar Base64 sem impor o limite padrão de 1 MB.
    client_max_body_size 0;

    location ^~ /api/ {
        # A barra final remove /api/: /api/contatos chega como /contatos.
        proxy_pass http://indexa_backend/;
        # Preserva também a porta do navegador para a verificação de origem.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Um asset ausente deve retornar 404, não HTML no lugar de JS/CSS/imagem.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|map)$ {
        try_files $uri =404;
    }
}
