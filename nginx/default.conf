server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Um asset ausente deve retornar 404, não HTML no lugar de JS/CSS/imagem.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|map)$ {
        try_files $uri =404;
    }
}
