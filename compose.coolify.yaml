# Arquivo independente: não combinar com compose.yaml, que contém build e ports locais.
services:
  backend:
    image: ghcr.io/felipe57863/indexa-backend:sha-1397f08174a70142e2f403d7af00a005c1a12ccd
    pull_policy: always
    restart: unless-stopped
    environment:
      # Reconhece HTTPS encerrado no proxy Coolify sem alterar a aplicação.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - h2-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/contatos"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: ghcr.io/felipe57863/indexa-frontend:sha-1397f08174a70142e2f403d7af00a005c1a12ccd
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/contatos"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  h2-data:
